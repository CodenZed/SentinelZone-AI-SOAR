POSTGRES_ADMIN_PASSWORD: ci-admin-db-password

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinelzone_ai_soar_test
          POSTGRES_USER: ai_soar_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_soar_test -d sentinelzone_ai_soar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI environment file
        run: cp .env.example .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.lock.txt

      - name: Run backend tests
        run: python -m pytest -q --tb=short

      - name: Build frontend
        run: node frontend/build.mjs

      - name: Run frontend tests
        run: node --test frontend/tests/*.test.mjs

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose down -v