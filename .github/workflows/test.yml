name: acceptance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Disposable PostgreSQL used only by the automated test suite
      TEST_DATABASE_URL: postgresql+psycopg://ai_soar_test:test-only-password@localhost:5432/sentinelzone_ai_soar_test

      # Values required only so docker-compose.yml can be validated in CI.
      # These are disposable CI-only credentials, not production secrets.
      DB_NAME: ai_soar
      DB_USER: ai_soar
      POSTGRES_PASSWORD: ci-application-db-password
      POSTGRES_ADMIN_PASSWORD: ci-admin-db-password

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinelzone_ai_soar_test
          POSTGRES_USER: ai_soar_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_soar_test -d sentinelzone_ai_soar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.lock.txt

      - name: Run backend tests
        run: python -m pytest -q --tb=short

      - name: Build frontend
        run: node frontend/build.mjs

      - name: Run frontend tests
        run: node --test frontend/tests/*.test.mjs

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose down -v